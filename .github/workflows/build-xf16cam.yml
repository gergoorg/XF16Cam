name: Build XF16Cam XR872

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xf16cam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      matrix:
        build_variant: [ptz, no_ptz, ptz_netlog, ptz_mqtt, no_ptz_mqtt, ptz_esphome, no_ptz_esphome]
    env:
      BUILD_VARIANT: ${{ matrix.build_variant }}
      # _netlog adds XF16CAM_NETLOG, the UDP console mirror; then one
      # integration (last): _mqtt adds XF16CAM_MQTT, the Home Assistant MQTT
      # client, or _esphome adds XF16CAM_ESPHOME, the ESPHome native API
      # server. Suffixes combine, so every test uses contains(), not
      # endsWith(). Keep this mapping in step with the Dockerfile.
      PRJ_EXTRA_SYMBOLS: ${{ startsWith(matrix.build_variant, 'no_ptz') && '-DNO_PTZ ' || '' }}${{ contains(matrix.build_variant, '_netlog') && '-DXF16CAM_NETLOG ' || '' }}${{ contains(matrix.build_variant, '_mqtt') && '-DXF16CAM_MQTT' || '' }}${{ contains(matrix.build_variant, '_esphome') && '-DXF16CAM_ESPHOME' || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test RTSP request parser
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude -Iproject/example/xf16cam \
            tests/xf16cam/test_rtsp_parser.c \
            project/example/xf16cam/xf16cam_rtsp_parser.c \
            -o /tmp/xf16cam-rtsp-parser-test
          /tmp/xf16cam-rtsp-parser-test

      - name: Test MQTT payload generators
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -DXF16CAM_MQTT \
            -Iinclude -Iproject/example/xf16cam \
            tests/xf16cam/test_mqtt_payload.c \
            project/example/xf16cam/xf16cam_mqtt_payload.c \
            -o /tmp/xf16cam-mqtt-payload-test
          /tmp/xf16cam-mqtt-payload-test

      - name: Test ESPHome protobuf helpers
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude -Iproject/example/xf16cam \
            tests/xf16cam/test_esphome_proto.c \
            project/example/xf16cam/xf16cam_esphome_proto.c \
            -o /tmp/xf16cam-esphome-proto-test
          /tmp/xf16cam-esphome-proto-test

      - name: Test ESPHome Noise handshake
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
          cc -std=c11 -Wall -Wextra -Werror -DXF16CAM_NOISE_INITIATOR \
            -Iinclude -Iproject/example/xf16cam \
            tests/xf16cam/test_esphome_noise.c \
            project/example/xf16cam/xf16cam_esphome_noise.c \
            -lmbedcrypto -o /tmp/xf16cam-esphome-noise-test
          /tmp/xf16cam-esphome-noise-test

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 8-2019-q3

      - name: Configure XR872 build
        shell: bash
        run: |
          printf '%s\n' \
            '__CONFIG_CHIP_TYPE ?= xr872' \
            '__CONFIG_HOSC_TYPE ?= 40' > .config
          chmod +x tools/mkimage
      - name: Apply os_thread.c.patch
        shell: bash
        run: |
          patch -p1 < patches/os_thread.c.patch

      - name: Apply lwipopts.h.patch (ESPHome listener)
        # A third lwIP listen PCB; see patches/lwipopts.h.patch. Keep in step with the Dockerfile.
        if: contains(matrix.build_variant, '_esphome')
        shell: bash
        run: |
          patch -p1 < patches/lwipopts.h.patch

      - name: Build flash image
        shell: bash
        run: |
          make -C project/example/xf16cam/gcc \
            CC_DIR="$(dirname "$(command -v arm-none-eabi-gcc)")" \
            PRJ_EXTRA_SYMBOLS="$PRJ_EXTRA_SYMBOLS" image

      - name: Build OTA image
        shell: bash
        run: |
          make -C project/example/xf16cam/gcc \
            CC_DIR="$(dirname "$(command -v arm-none-eabi-gcc)")" \
            PRJ_EXTRA_SYMBOLS="$PRJ_EXTRA_SYMBOLS" image_xz

      - name: Check critical code placement
        shell: bash
        run: |
          # Each integration client must be absent from the other images and in XIP on its own.
          if [[ "$BUILD_VARIANT" == *_mqtt* ]]; then
            mqtt_check="--require-xip xf16cam_mqtt_task --require-absent xf16cam_esphome_task"
          elif [[ "$BUILD_VARIANT" == *_esphome* ]]; then
            mqtt_check="--require-xip xf16cam_esphome_task --require-xip mbedtls_chachapoly_encrypt_and_tag --require-absent xf16cam_mqtt_task"
          else
            mqtt_check="--require-absent xf16cam_mqtt_task --require-absent xf16cam_esphome_task"
          fi
          python3 tools/xf16cam/check_symbol_placement.py \
            --elf project/example/xf16cam/gcc/xf16cam.axf \
            --require-sram xf16cam_http_flash_info \
            --require-sram xf16cam_http_ota \
            --require-sram flashc_suspend \
            --require-xip xf16cam_http_start \
            --require-absent dns_table \
            --require-absent igmp_group_list \
            $mqtt_check

      - name: Check 1 MiB flash budget
        shell: bash
        run: |
          # _mqtt builds carry ~12 KB more XIP than the 64 KiB floor allows; _esphome a little more.
          mkdir -p dist
          python3 tools/xf16cam/check_image_budget.py \
            --config project/example/xf16cam/image/xr872/image_auto_cal.cfg \
            --image-dir project/example/xf16cam/image/xr872 \
            --xip-reserve ${{ contains(matrix.build_variant, '_mqtt') && '56K' || contains(matrix.build_variant, '_esphome') && '48K' || '64K' }} \
            --ota-reserve ${{ contains(matrix.build_variant, '_esphome') && '60K' || '64K' }} \
            | tee dist/image-budget.txt
          {
            echo '```text'
            cat dist/image-budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package flash image
        shell: bash
        run: |
          version="$(sed -n 's/^#define XF16CAM_VERSION "\([^"]*\)"/\1/p' \
            project/example/xf16cam/xf16cam_version.h)"
          test -n "$version"
          mkdir -p dist
          cp project/example/xf16cam/image/xr872/xr_system.img \
            "dist/xf16cam-${BUILD_VARIANT}-xr872-v${version}.img"
          cp project/example/xf16cam/image/xr872/xr_system_img_xz.img \
            "dist/xf16cam-${BUILD_VARIANT}-xr872-v${version}-ota.img"
          arm-none-eabi-size project/example/xf16cam/gcc/xf16cam.axf \
            | tee dist/size.txt
          arm-none-eabi-size -A project/example/xf16cam/gcc/xf16cam.axf \
            > dist/sections.txt
          arm-none-eabi-nm -S --size-sort --radix=d \
            project/example/xf16cam/gcc/xf16cam.axf > dist/symbols.txt
          gzip -9 -c project/example/xf16cam/gcc/xf16cam.map \
            > dist/xf16cam.map.gz
          sha256sum dist/*.img > dist/SHA256SUMS
          echo "XF16CAM_VERSION=$version" >> "$GITHUB_ENV"

      - name: Upload flash image
        uses: actions/upload-artifact@v4
        with:
          name: xf16cam-${{ matrix.build_variant }}-xr872-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
